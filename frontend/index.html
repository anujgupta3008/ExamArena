<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- PWA & Mobile Web App -->
    <meta name="theme-color" content="#0a0b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>Exam Arena — AI-Powered Exam Analytics | Predict. Prepare. Excel.</title>
    <meta name="description" content="Exam Arena analyses 12+ years of exam papers through mathematical regression and AI to predict which topics will appear next. Heatmaps, AI predictions, mock exams & study planner — free." />
    <meta name="keywords" content="exam analytics, GATE preparation, exam topic prediction, study plan, AI exam predictor, past year paper analysis, Exam Arena" />
    <meta name="author" content="Exam Arena" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Exam Arena — AI-Powered Exam Analytics | Predict. Prepare. Excel." />
    <meta property="og:description" content="Stop guessing. Start predicting. Exam Arena uses 12+ years of exam paper data and AI to tell you exactly which topics to study, in which order, and how likely they are to appear." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Exam Arena" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Exam Arena — AI-Powered Exam Analytics" />
    <meta name="twitter:description" content="12+ years of exam paper data. AI predictions. Mock exams. Study planner. Free to start." />

    <!-- Structured Data — WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Exam Arena",
      "description": "AI-powered exam analytics platform with topic prediction, decadal heatmaps, mock exams, and dynamic study planning.",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "featureList": [
        "Topic Heatmap",
        "AI Prediction Engine",
        "AI Study Advisor (Strands Agents)",
        "Performance Gap Radar",
        "Mock Exam Generator",
        "Dynamic Study Planner"
      ]
    }
    </script>

    <!-- Structured Data — FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Which exams does Exam Arena cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Currently GATE CS, GATE ECE, and GATE ME — with Civil Engineering in development. UPSC and NEET are planned for future phases."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate are the AI predictions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our regression model has backtested at 94.2% accuracy across the last 3 GATE papers."
          }
        },
        {
          "@type": "Question",
          "name": "Is Exam Arena free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Heatmaps, predictions, study planner, and mock exams are free. The AI Study Advisor is a Pro feature."
          }
        }
      ]
    }
    </script>

    <!-- Performance: preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
