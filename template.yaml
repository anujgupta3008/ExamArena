AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Exam Arena API

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DATABASE_URL: '{{resolve:ssm:/exam-arena/database-url}}'
        GEMINI_API_KEY: '{{resolve:ssm:/exam-arena/gemini-api-key}}'
        S3_BUCKET_NAME: exam-arena-assets-ag
        SECRET_KEY: '{{resolve:ssm:/exam-arena/jwt-secret}}'
        COGNITO_USER_POOL_ID: '{{resolve:ssm:/exam-arena/cognito-pool-id}}'
        COGNITO_APP_CLIENT_ID: '{{resolve:ssm:/exam-arena/cognito-client-id}}'
        STRANDS_AGENTS: 'true'

Resources:
  ExamArenaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.main.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:InitiateAuth
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - arn:aws:s3:::exam-arena-assets-ag
                - arn:aws:s3:::exam-arena-assets-ag/*
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Policies:
        - AWSLambdaBasicExecutionRole

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for Prod environment"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
