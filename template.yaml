AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Exam Arena API

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DATABASE_URL: '{{resolve:ssm:/exam-arena/database-url}}'
        GEMINI_API_KEY: '{{resolve:ssm:/exam-arena/gemini-api-key}}'
        S3_BUCKET_NAME: exam-arena-assets-ag
        SECRET_KEY: '{{resolve:ssm:/exam-arena/jwt-secret}}'
        COGNITO_USER_POOL_ID: '{{resolve:ssm:/exam-arena/cognito-pool-id}}'
        COGNITO_APP_CLIENT_ID: '{{resolve:ssm:/exam-arena/cognito-client-id}}'
        STRANDS_AGENTS: 'true'

Resources:
  ExamArenaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.main.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:InitiateAuth
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - arn:aws:s3:::exam-arena-assets-ag
                - arn:aws:s3:::exam-arena-assets-ag/*
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt PdfProcessingQueue.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  PdfProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: exam-arena-pdf-processing
      VisibilityTimeout: 300

  PdfProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.pdf_processor_handler.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 300
      MemorySize: 1024
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt PdfProcessingQueue.Arn
            BatchSize: 1
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - arn:aws:s3:::exam-arena-assets-ag
                - arn:aws:s3:::exam-arena-assets-ag/*

  ExamArenaDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: ExamArena-Dashboard
      DashboardBody: !Sub >
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ExamArenaApiFunction}" ],
                  [ ".", "Errors", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "API Lambda Metrics"
              }
            }
          ]
        }

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ExamArena-HighErrorRate
      AlarmDescription: "Triggers if there are too many errors in the API Lambda"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExamArenaApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for Prod environment"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
